name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install required utilities
        run: sudo apt-get update && sudo apt-get install -y findutils

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          echo "SDK_ROOT=$SDK_ROOT"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          rm -rf "$SDK_ROOT" /tmp/sdk-extract
          mkdir -p /tmp/sdk-extract "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/sdk-extract/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/sdk-extract/cmdtools.zip -d /tmp/sdk-extract/
          EXTRACTED=$(find /tmp/sdk-extract -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "extracted dir: $EXTRACTED"
          mv "$EXTRACTED" "$SDK_ROOT/cmdline-tools/latest"
          chmod +x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          cat local.properties
          yes 2>/dev/null | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug
        env:
          GRADLE_OPTS: "-Xmx2048m -Xms512m"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
