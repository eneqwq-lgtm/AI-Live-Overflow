<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeskPet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            width: 100%; height: 100%;
            overflow: hidden;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        }
        #pet-container {
            position: relative;
            width: 150px; height: 150px;
            display: flex; align-items: center; justify-content: center;
        }
        #pet {
            width: 100%; height: 100%;
            transition: transform 0.3s ease;
        }
        .pet-layer.tapped { animation: bounce 0.3s ease; }
        .pet-layer.double-tapped { animation: spin 0.5s ease; }
        .pet-layer.long-pressed { animation: shake 0.5s ease; }
        .pet-layer.proud { animation: proud 0.6s ease; }
        .pet-layer.fling-left { animation: flingLeft 0.55s ease-in forwards; }
        .pet-layer.fling-right { animation: flingRight 0.55s ease-in forwards; }
        .pet-layer.climb-back { animation: climbBack 1.4s ease; }
        .pet-layer.waking { animation: wake 0.7s ease; }
        .pet-layer.asleep { filter: saturate(0.35) brightness(0.65); }
        .pet-layer.peek { animation: peek 3s ease infinite; }
        .pet-layer.carrying { animation: carry 2.2s ease infinite; }
        .pet-layer.nodding { animation: nod 1.6s ease infinite; }

        /* ---- 气泡 5 种风格 ---- */
        #bubble {
            position: absolute; bottom: 160px; left: 50%;
            transform: translateX(-50%);
            border-radius: 12px; padding: 8px 12px; font-size: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            opacity: 0; pointer-events: none; max-width: 160px;
            text-align: center; white-space: nowrap; z-index: 50;
        }
        #bubble.show { animation: fadeInOut 2.2s ease forwards; }
        #bubble::after {
            content: ''; position: absolute; bottom: -8px; left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent; border-right: 8px solid transparent;
            border-top: 8px solid rgba(255,255,255,0.95);
        }
        #bubble.normal { background: rgba(255,255,255,0.95); color: #333; }
        #bubble.normal::after { border-top-color: rgba(255,255,255,0.95); }
        #bubble.pink { background: rgba(255,182,220,0.95); color: #a63a6f; }
        #bubble.pink::after { border-top-color: rgba(255,182,220,0.95); }
        #bubble.whisper { background: rgba(110,110,125,0.92); color: #eee; }
        #bubble.whisper::after { border-top-color: rgba(110,110,125,0.92); }
        #bubble.shout { background: rgba(255,75,75,0.95); color: #fff; font-weight: bold; }
        #bubble.shout::after { border-top-color: rgba(255,75,75,0.95); }
        #bubble.jealous { background: rgba(90,205,125,0.95); color: #0b5c2a; }
        #bubble.jealous::after { border-top-color: rgba(90,205,125,0.95); }

        /* ---- 情绪引擎:Heat 红色渐变 ---- */
        #heat-overlay {
            position: fixed; inset: 0; z-index: 99; pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(255,0,60,0) 45%, rgba(255,0,60,0.65) 100%);
            opacity: 0; transition: opacity 1s ease;
        }

        /* ---- 孤独状态 ---- */
        #sleep-zzz {
            position: absolute; top: -6px; right: -8px; font-size: 14px; opacity: 0; z-index: 40;
        }
        #sleep-zzz.show { animation: zzz 2s ease infinite; }
        .bubble-float {
            position: absolute; bottom: 120px; width: 8px; height: 8px;
            border-radius: 50%; background: rgba(150,200,255,0.85); z-index: 30;
            animation: floatUp 2.5s linear forwards; pointer-events: none;
        }

        /* ---- keyframes ---- */
        @keyframes bounce { 0%,100%{transform:scale(1);} 50%{transform:scale(1.25);} }
        @keyframes spin { 0%{transform:rotate(0);} 100%{transform:rotate(360deg);} }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} }
        @keyframes proud { 0%,100%{transform:scale(1);} 30%{transform:scale(1.15) rotate(-8deg);} 70%{transform:scale(1.15) rotate(8deg);} }
        @keyframes flingLeft { 0%{transform:translateX(0);} 100%{transform:translateX(-180px) rotate(-40deg); opacity:0.3;} }
        @keyframes flingRight { 0%{transform:translateX(0);} 100%{transform:translateX(180px) rotate(40deg); opacity:0.3;} }
        @keyframes climbBack {
            0%{transform:translateX(0) scale(0.8); opacity:0.3;}
            40%{transform:translateX(-14px) scale(0.85); opacity:0.7;}
            100%{transform:translateX(0) scale(1); opacity:1;}
        }
        @keyframes wake {
            0%{transform:translateY(0) scale(0.9); filter:brightness(0.7);}
            40%{transform:translateY(-12px) scale(1.1);}
            100%{transform:translateY(0) scale(1); filter:brightness(1);}
        }
        @keyframes fadeInOut {
            0%{opacity:0; transform:translateX(-50%) translateY(10px);}
            15%{opacity:1; transform:translateX(-50%) translateY(0);}
            85%{opacity:1; transform:translateX(-50%) translateY(0);}
            100%{opacity:0; transform:translateX(-50%) translateY(-10px);}
        }
        @keyframes idle { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }
        @keyframes zzz { 0%{opacity:0; transform:translateY(4px);} 50%{opacity:1;} 100%{opacity:0; transform:translateY(-8px);} }
        @keyframes floatUp { 0%{transform:translateY(0); opacity:0.9;} 100%{transform:translateY(-70px); opacity:0;} }
        @keyframes peek { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-14px);} 75%{transform:translateX(14px);} }
        @keyframes carry {
            0%,100%{transform:translateX(0);}
            25%{transform:translateX(18px);}
            75%{transform:translateX(-18px);}
        }
        @keyframes nod {
            0%,100%{transform:rotate(0);}
            50%{transform:rotate(6deg) translateY(2px);}
        }
        .idle { animation: idle 3s ease-in-out infinite; }
        .face-group { transition: opacity 0.2s ease; }
    </style>
</head>
<body>
    <div id="heat-overlay"></div>
    <div id="pet-container">
        <div id="sleep-zzz">💤</div>
        <div id="bubble" class="normal"></div>
        <svg id="pet-default" class="pet-layer" viewBox="-15 -25 45 45" style="display:inline;width:100%;height:100%;">
<defs>
    <style>
      .breathe-anim {
        transform-origin: 7.5px 13px;
        animation: breathe 3.2s infinite ease-in-out;
      }

      .eyes-blink {
        transform-origin: 7.5px 9px;
        animation: eye-blink 4s infinite ease-in-out;
      }

      #eyes-js {
        transition: transform 0.2s ease-out;
      }

      /* Visible arm (left, facing screen) — occasional wobble */
      .arm-wobble {
        transform-box: fill-box;
        transform-origin: 100% 0%; /* Shoulder joint: body-side top */
        animation: arm-wobble 25s infinite ease-in-out;
      }

      @keyframes breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      @keyframes eye-blink {
        0%, 10%, 100% { transform: scaleY(1); }
        5% { transform: scaleY(0.1); }
      }

      /* Arm wobble: 25s cycle, still ~23s, quick wave in ~1.5s near the end */
      @keyframes arm-wobble {
        0%, 91%, 97%, 100% { transform: rotate(0deg); }
        92% { transform: rotate(18deg); }
        93.5% { transform: rotate(-5deg); }
        95% { transform: rotate(14deg); }
      }
    </style>
  </defs>

  <!-- No shadow (against screen edge, no ground plane) -->

  <!-- Entire character leaning: rotate -12° around feet base (7.5, 15) -->
  <!-- Negative = counterclockwise = head tilts left toward screen = peeking pose -->
  <g transform="rotate(-12, 7.5, 15)">

    <!-- Legs (inside rotation group so they tilt with the body) -->
    <g fill="#DE886D">
      <rect x="3" y="11" width="1" height="4"/>
      <rect x="5" y="11" width="1" height="4"/>
      <rect x="9" y="11" width="1" height="4"/>
      <rect x="11" y="11" width="1" height="4"/>
    </g>

    <!-- Upper Body (JS body-shift preserved for compatibility) -->
    <g id="body-js">
      <g class="breathe-anim">
        <!-- Torso -->
        <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

        <!-- Left Arm (visible side, facing screen) — extended + wobble -->
        <g class="arm-wobble">
          <rect x="-1.5" y="9" width="4.5" height="2" fill="#DE886D"/>
        </g>

        <!-- Right Arm (near edge, partially hidden) — normal -->
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>

        <!-- Eyes: JS translate wrapper + CSS blink -->
        <g id="eyes-js" fill="#000000">
          <g class="eyes-blink">
            <rect x="4" y="8" width="1" height="2"/>
            <rect x="10" y="8" width="1" height="2"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
<svg id="pet-happy" class="pet-layer" viewBox="-15 -25 45 45" style="display:none;width:100%;height:100%;">
<defs>
    <style>
      .breathe-anim {
        transform-origin: 7.5px 13px;
        animation: breathe 3.2s infinite ease-in-out;
      }

      /* Happy arm wave — continuous, fast, fixed pivot at shoulder */
      .arm-happy {
        transform-origin: 2px 9px; /* Shoulder joint in SVG coords, no fill-box */
        animation: arm-happy-wave 0.4s infinite alternate ease-in-out;
      }

      /* Eyes ^^ blink — mostly ^^ with occasional full blink */
      .eyes-happy-blink {
        transform-origin: 7.5px 9px;
        animation: happy-blink 3s infinite ease-in-out;
      }

      /* Pixel-Art Sparkle Animations */
      .spark-center {
        opacity: 0;
        animation: flash-center 1.5s infinite step-end;
        animation-delay: var(--delay, 0s);
      }
      .spark-outer {
        opacity: 0;
        animation: flash-outer 1.5s infinite step-end;
        animation-delay: var(--delay, 0s);
      }

      @keyframes breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      /* Continuous happy waving */
      @keyframes arm-happy-wave {
        0% { transform: rotate(22deg); }
        100% { transform: rotate(-8deg); }
      }

      /* Happy blink: frequent blinks to look excited */
      @keyframes happy-blink {
        0%, 12%, 30%, 42%, 100% { transform: scaleY(1); }
        6% { transform: scaleY(0.1); }
        36% { transform: scaleY(0.1); }
      }

      @keyframes flash-center {
        0%  { opacity: 0; }
        10% { opacity: 1; }
        30% { opacity: 0; }
        100%{ opacity: 0; }
      }
      @keyframes flash-outer {
        0%  { opacity: 0; }
        20% { opacity: 1; }
        40% { opacity: 0; }
        100%{ opacity: 0; }
      }
    </style>

    <!-- Reusable Pixel Art Sparkle (from clawd-happy.svg) -->
    <g id="px-sparkle">
      <rect class="spark-center" x="-0.5" y="-0.5" width="1" height="1" />
      <path class="spark-outer" d="M -0.5,-1.5 h1 v1 h-1 z
                                   M -0.5,0.5 h1 v1 h-1 z
                                   M -1.5,-0.5 h1 v1 h-1 z
                                   M 0.5,-0.5 h1 v1 h-1 z" />
    </g>
  </defs>

  <!-- Entire character leaning -->
  <g transform="rotate(-12, 7.5, 15)">

    <!-- Legs -->
    <g fill="#DE886D">
      <rect x="3" y="11" width="1" height="4"/>
      <rect x="5" y="11" width="1" height="4"/>
      <rect x="9" y="11" width="1" height="4"/>
      <rect x="11" y="11" width="1" height="4"/>
    </g>

    <g id="body-js">
      <g class="breathe-anim">
        <!-- Torso -->
        <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

        <!-- Left Arm — happy continuous wave + flower on top -->
        <g class="arm-happy">
          <rect x="-1.5" y="9" width="4.5" height="2" fill="#DE886D"/>
          <!-- Flower held at hand tip -->
          <!-- Stem (black, from hand top to flower) -->
          <rect x="-1.5" y="6" width="0.5" height="3" fill="#000000"/>
          <!-- Petals (yellow pixel cross) -->
          <rect x="-2.5" y="5" width="0.8" height="0.8" fill="#FFD700"/>
          <rect x="-0.5" y="5" width="0.8" height="0.8" fill="#FFD700"/>
          <rect x="-1.5" y="4.2" width="0.8" height="0.8" fill="#FFD700"/>
          <rect x="-1.5" y="5.8" width="0.8" height="0.8" fill="#FFD700"/>
          <!-- Center -->
          <rect x="-1.5" y="5" width="0.8" height="0.8" fill="#FFA000"/>
        </g>

        <!-- Right Arm -->
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>

        <!-- Eyes: ^^ happy squint with blink -->
        <g class="eyes-happy-blink">
          <g fill="none" stroke="#000000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3.5,9 4.5,8 5.5,9"/>
            <polyline points="9.5,9 10.5,8 11.5,9"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Sparkles (outside rotation = stay upright, within window bounds) -->
  <use href="#px-sparkle" x="-3" y="0"  fill="#FFD700" style="--delay: 0s"/>
  <use href="#px-sparkle" x="-6" y="6"  fill="#FFA000" style="--delay: 0.4s"/>
  <use href="#px-sparkle" x="0"  y="-5" fill="#FFF59D" style="--delay: 0.8s"/>
</svg>
<svg id="pet-peek" class="pet-layer" viewBox="-15 -25 45 45" style="display:none;width:100%;height:100%;">
<defs>
    <style>
      .breathe-anim {
        transform-origin: 7.5px 13px;
        animation: breathe 3.2s infinite ease-in-out;
      }

      .eyes-blink {
        transform-origin: 7.5px 9px;
        animation: eye-blink 4s infinite ease-in-out;
      }

      #eyes-js {
        transition: transform 0.2s ease-out;
      }

      /* Arm waving — fast 3 waves then pause, loop */
      .arm-wave {
        transform-origin: 2px 9px;
        animation: peek-wave 3s infinite ease-in-out;
      }

      @keyframes breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      @keyframes eye-blink {
        0%, 10%, 100% { transform: scaleY(1); }
        5% { transform: scaleY(0.1); }
      }

      /* Fast 3 waves (~0.9s) then still (~2.1s), loop */
      @keyframes peek-wave {
        0% { transform: rotate(0deg); }
        5% { transform: rotate(35deg); }
        10% { transform: rotate(-15deg); }
        15% { transform: rotate(35deg); }
        20% { transform: rotate(-15deg); }
        25% { transform: rotate(35deg); }
        30%, 100% { transform: rotate(0deg); }
      }
    </style>
  </defs>

  <!-- Entire character leaning -->
  <g transform="rotate(-12, 7.5, 15)">

    <!-- Legs -->
    <g fill="#DE886D">
      <rect x="3" y="11" width="1" height="4"/>
      <rect x="5" y="11" width="1" height="4"/>
      <rect x="9" y="11" width="1" height="4"/>
      <rect x="11" y="11" width="1" height="4"/>
    </g>

    <!-- Upper Body -->
    <g id="body-js">
      <g class="breathe-anim">
        <!-- Torso -->
        <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

        <!-- Left Arm — continuous big wave -->
        <g class="arm-wave">
          <rect x="-1.5" y="9" width="5.5" height="2" fill="#DE886D"/>
        </g>

        <!-- Right Arm -->
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>

        <!-- Eyes: JS translate wrapper + CSS blink -->
        <g id="eyes-js" fill="#000000">
          <g class="eyes-blink">
            <rect x="4" y="8" width="1" height="2"/>
            <rect x="10" y="8" width="1" height="2"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
<svg id="pet-typing" class="pet-layer" viewBox="-15 -25 45 45" style="display:none;width:100%;height:100%;">
<defs>
    <style>
      .breathe-anim {
        transform-origin: 7.5px 13px;
        animation: breathe 3.2s infinite ease-in-out;
      }

      .eyes-read {
        animation: read-code 1.2s infinite;
      }

      #eyes-js {
        transition: transform 0.2s ease-out;
      }

      .arm-l-type {
        transform-origin: 3px 10px;
        animation: type-l 0.15s infinite ease-in-out;
      }
      .arm-r-type {
        transform-origin: 12px 10px;
        animation: type-r 0.12s infinite ease-in-out;
      }

      /* Floating data packets */
      .data-bit {
        opacity: 0;
        animation: float-data 1s infinite linear;
      }
      .d1 { animation-delay: 0.0s; transform-origin: -2px 10px; }
      .d2 { animation-delay: 0.3s; transform-origin: 5px 12px; }
      .d3 { animation-delay: 0.6s; transform-origin: 12px 11px; }
      .d4 { animation-delay: 0.8s; transform-origin: 17px 9px; }
      .d5 { animation-delay: 0.1s; transform-origin: 8px 10px; }
      .d6 { animation-delay: 0.4s; transform-origin: 0px 11px; }
      .d7 { animation-delay: 0.7s; transform-origin: 15px 12px; }

      @keyframes breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      @keyframes read-code {
        0%, 14%   { transform: translate(-2px, 0); }
        15%, 29%  { transform: translate(-1.5px, 0); }
        30%, 44%  { transform: translate(-1px, 0); }
        45%, 59%  { transform: translate(-0.5px, 0); }
        60%, 84%  { transform: translate(0px, 0); }
        85%, 100% { transform: translate(-2px, 0); }
      }

      @keyframes type-l {
        0%   { transform: rotate(-10deg); }
        25%  { transform: rotate(15deg); }
        50%  { transform: rotate(-5deg); }
        75%  { transform: rotate(10deg); }
        100% { transform: rotate(-10deg); }
      }

      @keyframes type-r {
        0%   { transform: rotate(10deg); }
        25%  { transform: rotate(-15deg); }
        50%  { transform: rotate(5deg); }
        75%  { transform: rotate(-10deg); }
        100% { transform: rotate(10deg); }
      }

      .logo-glow {
        animation: logo-pulse 1.5s infinite alternate ease-in-out;
      }

      @keyframes logo-pulse {
        0% { opacity: 0.4; }
        100% { opacity: 1; }
      }

      /* Packets float up and fade */
      @keyframes float-data {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        20% { opacity: 0.8; }
        100% { transform: translateY(-15px) scale(1.2); opacity: 0; }
      }
    </style>

    <!-- A small square to represent data/code -->
    <g id="pixel-packet">
      <rect x="0" y="0" width="1.5" height="1.5" />
    </g>
  </defs>

  <!-- No shadow (against screen edge, no ground plane) -->

  <!-- Entire character leaning: rotate -12° around feet base (7.5, 15) -->
  <!-- Negative = counterclockwise = head tilts left toward screen = peeking pose -->
  <g transform="rotate(-12, 7.5, 15)">

    <!-- Legs (inside rotation group so they tilt with the body) -->
    <g fill="#DE886D">
      <rect x="3" y="11" width="1" height="4"/>
      <rect x="5" y="11" width="1" height="4"/>
      <rect x="9" y="11" width="1" height="4"/>
      <rect x="11" y="11" width="1" height="4"/>
    </g>

    <!-- Upper Body (JS body-shift preserved for compatibility) -->
    <g id="body-js">
      <g class="breathe-anim">
        <!-- Torso -->
        <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

        <!-- Left Arm — typing -->
        <g class="arm-l-type">
          <rect x="0" y="9" width="3" height="2" fill="#DE886D"/>
        </g>

        <!-- Right Arm — typing -->
        <g class="arm-r-type">
          <rect x="12" y="9" width="3" height="2" fill="#DE886D"/>
        </g>

        <!-- Eyes: JS translate wrapper + CSS blink -->
        <g id="eyes-js" fill="#000000">
          <g class="eyes-read">
            <rect x="4" y="8" width="1" height="2"/>
            <rect x="10" y="8" width="1" height="2"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Pixel Laptop (inside rotation group so it leans with Clawd) -->
    <g id="laptop" transform="translate(3, 11)">
      <!-- Laptop Base -->
      <rect x="-0.5" y="4" width="8" height="1" fill="#546E7A" rx="0.5"/>
      <!-- Screen Back -->
      <rect x="0" y="0" width="7" height="4.5" fill="#78909C" rx="0.5"/>
      <!-- Glowing Logo -->
      <circle cx="3.5" cy="2" r="1.2" fill="#40C4FF" opacity="0.2" class="logo-glow"/>
      <rect x="3" y="1.5" width="1" height="1" fill="#FFFFFF" class="logo-glow"/>
    </g>
  </g>
  <!-- Data Particles floating up from behind the laptop -->
  <g class="data-particles" fill="#40C4FF">
    <use href="#pixel-packet" class="data-bit d1" x="-2" y="12" />
    <use href="#pixel-packet" class="data-bit d2" x="5" y="11" />
    <use href="#pixel-packet" class="data-bit d3" x="12" y="13" />
    <use href="#pixel-packet" class="data-bit d4" x="17" y="11" />
    <use href="#pixel-packet" class="data-bit d5" x="8" y="10" />
    <use href="#pixel-packet" class="data-bit d6" x="1" y="11" />
    <use href="#pixel-packet" class="data-bit d7" x="15" y="12" />
  </g>
</svg>
<svg id="pet-alert" class="pet-layer" viewBox="-15 -25 45 45" style="display:none;width:100%;height:100%;">
<defs>
    <style>
      .breathe-anim {
        transform-origin: 7.5px 13px;
        animation: breathe 3.2s infinite ease-in-out;
      }

      .arm-alert {
        transform-origin: 2px 9px;
        animation: alert-arm 4s infinite ease-in-out;
      }

      /* Normal rect eyes: visible first, hidden after blink */
      .eyes-rect {
        transform-origin: 7.5px 9px; /* eye vertical center for blink */
        animation: rect-vis 4s infinite step-end, rect-move 4s infinite ease-in-out;
      }

      /* xmark squint eyes: hidden first, visible after switch */
      .eyes-xmark {
        visibility: hidden;
        animation: xmark-vis 4s infinite step-end;
      }

      .alert-pop {
        animation: alert-flash 4s infinite ease-in-out;
        opacity: 0;
      }

      @keyframes breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      @keyframes alert-arm {
        0%, 49% { transform: rotate(0deg); }
        51% { transform: rotate(20deg); }
        60% { transform: rotate(-8deg); }
        64% { transform: rotate(20deg); }
        68% { transform: rotate(-8deg); }
        72% { transform: rotate(20deg); }
        76% { transform: rotate(-8deg); }
        80% { transform: rotate(20deg); }
        84% { transform: rotate(-8deg); }
        88% { transform: rotate(20deg); }
        92%, 100% { transform: rotate(0deg); }
      }

      /* Rect eyes: center, wait for exclamation, slowly look left, back, pause, blink, switch */
      @keyframes rect-move {
        0%, 16% { transform: translate(0, 0) scaleY(1); }
        22%, 28% { transform: translate(-2px, 0) scaleY(1); }
        34% { transform: translate(0, 0) scaleY(1); }
        36% { transform: translate(0, 0) scaleY(0.1); }
        37%, 39% { transform: translate(0, 0) scaleY(1); }
        41% { transform: translate(0, 0) scaleY(0.1); }
        42%, 100% { transform: translate(0, 0) scaleY(1); }
      }

      /* Rect eyes visibility: visible → hidden at 22%, back at 91% */
      @keyframes rect-vis {
        0% { visibility: visible; }
        42% { visibility: hidden; }
        91% { visibility: visible; }
      }

      /* xmark eyes visibility: hidden at start, visible at 42%, hidden at 89% */
      @keyframes xmark-vis {
        0% { visibility: hidden; }
        42% { visibility: visible; }
        89% { visibility: hidden; }
      }

      @keyframes alert-flash {
        0%, 8% { opacity: 0; transform: scale(0.5); }
        12% { opacity: 1; transform: translate(0, -4px) scale(1.2); }
        20%, 70% { opacity: 1; transform: translate(0, -4px) scale(1); }
        85%, 100% { opacity: 0; transform: translate(0, -6px) scale(0.8); }
      }
    </style>
  </defs>

  <!-- Entire character leaning -->
  <g transform="rotate(-12, 7.5, 15)">

    <!-- Legs -->
    <g fill="#DE886D">
      <rect x="3" y="11" width="1" height="4"/>
      <rect x="5" y="11" width="1" height="4"/>
      <rect x="9" y="11" width="1" height="4"/>
      <rect x="11" y="11" width="1" height="4"/>
    </g>

    <g id="body-js">
      <g class="breathe-anim">
        <!-- Torso -->
        <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

        <!-- Left Arm — still then shake -->
        <g class="arm-alert">
          <rect x="-1.5" y="9" width="4.5" height="2" fill="#DE886D"/>
        </g>

        <!-- Right Arm -->
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>

        <!-- Phase 1: Normal rect eyes (look left at exclamation, then blink away) -->
        <g class="eyes-rect" fill="#000000">
          <rect x="4" y="8" width="1" height="2"/>
          <rect x="10" y="8" width="1" height="2"/>
        </g>

        <!-- Phase 2: >< squint eyes (appear after blink) -->
        <g class="eyes-xmark" fill="none" stroke="#000000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4,8 5.5,9 4,10"/>
          <polyline points="11,8 9.5,9 11,10"/>
        </g>
      </g>
    </g>

  </g>

  <!-- Exclamation mark (outside rotation = stays vertical) -->
  <g class="alert-pop" fill="#FF3D00">
    <rect x="-8" y="5" width="2" height="4"/>
    <rect x="-8" y="10" width="2" height="2"/>
  </g>
</svg>
    </div>

    <script>
        const bubble = document.getElementById('bubble');
        const zzz = document.getElementById('sleep-zzz');
        const heatOverlay = document.getElementById('heat-overlay');
        const container = document.getElementById('pet-container');
        const petLayers = {
            default: document.getElementById('pet-default'),
            happy: document.getElementById('pet-happy'),
            peek: document.getElementById('pet-peek'),
            typing: document.getElementById('pet-typing'),
            alert: document.getElementById('pet-alert')
        };
        const MOOD_MAP = {
            sleepy: 'default', excited: 'happy', sad: 'default',
            angry: 'alert', shy: 'peek', sleep: 'default'
        };
        function getPet() {
            return document.querySelector('.pet-layer[style*="inline"], .pet-layer:not([style*="none"])');
        }

        /* ================= 词池(自言自语) ================= */
        const POOLS = {
            daily: ['好想吃零食...', '今天也要加油鸭~', '天气不错呢', '摸鱼时间到', '饿了吗?去吃饭吧', '这个 app 看起来好玩'],
            clingy: ['想你了~', '别走嘛...', '再陪我一会嘛', '哼,都不理我', '摸摸我嘛', '你在我就在'],
            chaos: ['啊啊啊啊啊', '刚刚发生了什么?!', '有点混乱...', '我要闹了哦!', '哼!', '不管了先转两圈'],
            night: ['还不睡?!', '凌晨了哦...', '再玩就秃了', '快去睡觉!!', '晚安...zZ', '熬夜冠军是你吗']
        };

        /* ================= 状态 ================= */
        let heat = 0;
        let currentFace = 'default';
        let asleep = false;
        let lonelyStage = 0;            // 0=正常 1=偷看 2=吹泡泡 3=搬东西 4=打瞌睡 5=睡着
        let lastInteraction = Date.now();
        let tapCount = 0;
        let tapResetTimer = null;
        let moodTimer = null, blinkTimer = null, lonelyCheckTimer = null;
        let waterStage = 0;             // 喝水提醒递进
        let waterTimer = null;
        let pushCooldown = 0;
        let heatInterval = null;

        /* ================= 气泡 ================= */
        function showBubble(text, style) {
            style = style || 'normal';
            bubble.className = style;
            bubble.textContent = text;
            void bubble.offsetWidth;
            bubble.classList.add('show');
            setTimeout(() => { bubble.className = style; }, 2300);
        }

        /* ================= 表情 ================= */
        function setFace(name, duration) {
            if (!petLayers[name]) name = MOOD_MAP[name] || 'default';
            if (moodTimer) clearTimeout(moodTimer);
            Object.keys(petLayers).forEach(k => {
                petLayers[k].style.display = (k === name) ? 'inline' : 'none';
            });
            currentFace = name;
            if (duration) moodTimer = setTimeout(() => { if (!asleep) setFace('default'); }, duration);
        }

        function animate(cls, revertMs) {
            const p = getPet();
            p.classList.remove('idle', 'peek', 'carrying', 'nodding', 'asleep');
            void p.offsetWidth;
            p.classList.add(cls);
            setTimeout(() => { p.classList.remove(cls); p.classList.add('idle'); }, revertMs);
        }


        /* ================= Heat 情绪引擎 ================= */
        function addHeat(n) {
            heat = Math.max(0, Math.min(100, heat + n));
            updateHeat();
        }
        function updateHeat() {
            heatOverlay.style.opacity = (heat / 100) * 0.85;
        }
        function startHeatDecay() {
            if (heatInterval) clearInterval(heatInterval);
            heatInterval = setInterval(() => { if (heat > 0) { heat--; updateHeat(); } }, 30000);
        }

        /* ================= 孤独递进 ================= */
        function enterLonelyStage(stage) {
            if (stage <= lonelyStage && stage !== 5) return;
            lonelyStage = stage;
            getPet().classList.remove('peek', 'carrying', 'nodding', 'idle', 'asleep');
            switch (stage) {
                case 1: // 偷看
                    setFace('default');
                    getPet().classList.add('peek');
                    showBubble('…在看什么呀?', 'whisper');
                    break;
                case 2: // 吹泡泡
                    setFace('happy', 3000);
                    getPet().classList.add('idle');
                    blowBubbles(6);
                    showBubble('(吹泡泡)', 'whisper');
                    break;
                case 3: // 搬东西
                    setFace('happy', 3000);
                    getPet().classList.add('carrying');
                    showBubble('(搬东西…)', 'whisper');
                    break;
                case 4: // 打瞌睡
                    setFace('sleepy');
                    getPet().classList.add('nodding');
                    showBubble('好困…zZ', 'whisper');
                    break;
                case 5: // 睡着
                    setFace('sleep');
                    asleep = true;
                    getPet().classList.add('asleep');
                    zzz.classList.add('show');
                    showBubble('Zzz…', 'whisper');
                    break;
            }
            console.log('[pet] lonely stage: ' + stage);
        }

        function blowBubbles(n) {
            for (let i = 0; i < n; i++) {
                setTimeout(() => {
                    const b = document.createElement('div');
                    b.className = 'bubble-float';
                    b.style.left = (30 + Math.random() * 90) + 'px';
                    container.appendChild(b);
                    setTimeout(() => b.remove(), 2600);
                }, i * 350);
            }
        }

        function checkLoneliness() {
            const idleMin = (Date.now() - lastInteraction) / 60000;
            if (idleMin >= 30) enterLonelyStage(5);
            else if (idleMin >= 20) enterLonelyStage(4);
            else if (idleMin >= 15) enterLonelyStage(3);
            else if (idleMin >= 10) enterLonelyStage(2);
            else if (idleMin >= 5) enterLonelyStage(1);
        }

        /* ================= 唤醒过渡 ================= */
        function wakeUp() {
            if (!asleep) return true;
            asleep = false;
            lonelyStage = 0;
            zzz.classList.remove('show');
            getPet().classList.remove('asleep', 'peek', 'carrying', 'nodding');
            animate('waking', 700);
            setFace('happy', 2000);
            showBubble('唔…你回来啦~', 'pink');
            console.log('[pet] wake');
            return false; // 本次交互由唤醒消费
        }

        /* ================= 连击计数 ================= */
        function registerTap() {
            tapCount++;
            if (tapResetTimer) clearTimeout(tapResetTimer);
            tapResetTimer = setTimeout(() => { tapCount = 0; }, 2000);
            if (tapCount === 3) {
                showBubble('戳我三次啦!', 'pink');
                animate('proud', 600);
                setFace('happy', 2000);
                addHeat(3);
                console.log('[pet] combo x3');
            } else if (tapCount === 5) {
                showBubble('五次了!!好痒~', 'pink');
                animate('proud', 600);
                setFace('excited', 2500);
                addHeat(6);
                console.log('[pet] combo x5');
            } else if (tapCount === 8) {
                showBubble('啊啊啊戳了八次!!!', 'shout');
                animate('spin', 800);
                setFace('excited', 3000);
                addHeat(10);
                console.log('[pet] combo x8');
            }
        }

        /* ================= 触发词三级响应 T1/T2/T3 ================= */
        const T1_WORDS = ['讨厌', '滚', '蠢', '笨蛋', '死', '打死'];
        const T2_WORDS = ['爱', '喜欢', '想你', '宝贝', '亲亲', '抱抱', '可爱'];
        const T3_WORDS = ['晚安', '睡觉', '休息', '累了', '加班', '好烦'];

        function analyzePush(text) {
            if (T1_WORDS.some(w => text.includes(w))) return 1;
            if (T2_WORDS.some(w => text.includes(w))) return 2;
            if (T3_WORDS.some(w => text.includes(w))) return 3;
            return 0;
        }

        function reactToLevel(level, text) {
            switch (level) {
                case 1:
                    setFace('angry', 3000);
                    showBubble('!!你居然这么说', 'shout');
                    addHeat(-8);
                    break;
                case 2:
                    setFace('shy', 3000);
                    showBubble('诶嘿…', 'pink');
                    addHeat(12);
                    break;
                case 3:
                    setFace('sleepy', 3000);
                    showBubble('那要好好休息哦~', 'whisper');
                    addHeat(4);
                    break;
                default:
                    showBubble(text, 'normal');
            }
            console.log('[pet] push level: ' + level);
        }

        /* ================= 喝水提醒 ================= */
        function startWaterReminder() {
            if (waterTimer) clearInterval(waterTimer);
            waterTimer = setInterval(() => {
                waterStage++;
                if (waterStage === 1) {
                    showBubble('喝水时间到~', 'pink');
                } else if (waterStage === 2) {
                    showBubble('该喝水了!', 'shout');
                    setFace('angry', 2500);
                } else {
                    showBubble('快去喝水!!!', 'shout');
                    setFace('angry', 3000);
                    animate('shake', 500);
                }
                console.log('[pet] water reminder stage: ' + waterStage);
            }, 120 * 60000);
        }

        /* ================= 待机独白(时段感知) ================= */
        function poolForHour(h) {
            if (h < 6) return POOLS.night;
            if (h < 9) return POOLS.daily;
            if (h >= 23) return POOLS.night;
            return POOLS.daily;
        }

        function ambientBubble() {
            if (asleep) return;
            const h = new Date().getHours();
            const pool = poolForHour(h);
            const roll = Math.random();
            if (roll < 0.6) {
                showBubble(pool[Math.floor(Math.random() * pool.length)]);
            } else if (roll < 0.8) {
                showBubble(POOLS.clingy[Math.floor(Math.random() * POOLS.clingy.length)], 'pink');
            } else {
                showBubble(POOLS.chaos[Math.floor(Math.random() * POOLS.chaos.length)], 'jealous');
            }
            console.log('[pet] ambient bubble (hour ' + h + ')');
        }

        /* ================= 心情轮换 ================= */
        function idleMoodCycle() {
            moodTimer = setInterval(() => {
                if (currentFace !== 'default' || asleep || lonelyStage >= 4) return;
                const pool = ['happy', 'sleepy', 'excited', 'sad', 'shy'];
                const m = pool[Math.floor(Math.random() * pool.length)];
                setFace(m, 3000);
            }, 8000 + Math.random() * 6000);
        }

        /* ================= 交互登记 ================= */
        function interact() {
            lastInteraction = Date.now();
            if (lonelyStage > 0 && lonelyStage < 5) {
                lonelyStage = 0;
                getPet().classList.remove('peek', 'carrying', 'nodding', 'asleep');
            }
        }

        /* ================= 对外 API ================= */
        window.petEngine = {
            onTap: function() {
                if (!wakeUp()) return;
                interact();
                addHeat(2);
                animate('tapped', 300);
                setFace('happy', 1800);
                showBubble(['Hey!', 'Hmm?', '好耶~', 'Pet me more~', '嗨!'].random());
                registerTap();
                window.petEngine.onWaterConfirm();
                console.log('[pet] tap');
            },
            onDoubleTap: function() {
                if (!wakeUp()) return;
                interact();
                addHeat(4);
                animate('double-tapped', 500);
                setFace('excited', 2500);
                showBubble(['Wheee!', 'Dizzy!', '晕了晕了~', 'Spin spin!'].random());
                console.log('[pet] doubleTap');
            },
            onLongPress: function() {
                if (!wakeUp()) return;
                interact();
                addHeat(3);
                animate('long-pressed', 500);
                setFace('sleepy', 2500);
                showBubble(['!!', '痒痒的...', '///', '摸够了啦~'].random());
                console.log('[pet] longPress');
            },
            onScreenshot: function() {
                interact();
                addHeat(5);
                setFace('excited', 2500);
                showBubble(['Cheese!', '茄子~', '拍我干嘛~', 'Strike a pose!'].random(), 'pink');
                console.log('[pet] screenshot');
            },
            onAppChanged: function(packageName) {
                interact();
                const map = {
                    'com.instagram.android': ['刷 Ins 呢~', '又在看美女!', '吃醋了!'],
                    'com.twitter.android': ['Twitter 时间!', '在看啥新闻~'],
                    'com.facebook.katana': ['FB~', '好久没见这个了'],
                    'com.google.android.youtube': ['看视频~', '好看吗!'],
                    'com.tencent.mm': ['微信~', '和谁聊天呢!', '吃醋了!'],
                    'com.android.chrome': ['上网冲浪~'],
                    'com.microsoft.emmx': ['在用 Edge 呀~', '查什么呢~'],
                    'com.termux': ['在敲代码!好厉害~'],
                    'com.taobao.taobao': ['又在淘宝!买东西啦?', '给我也买一个嘛~'],
                    'com.ss.android.ugc.aweme': ['刷抖音!都不陪我!', '又是抖音...吃醋!'],
                    'com.zhihu.android': ['知乎~', '又在看故事~']
                };
                const list = map[packageName] || ['切换 app 啦!', '在看啥呢~'];
                const msg = list[Math.floor(Math.random() * list.length)];
                const style = (msg.includes('吃醋')) ? 'jealous' : 'normal';
                if (style === 'jealous') { setFace('sad', 2500); addHeat(-3); }
                else setFace('happy', 1800);
                showBubble(msg, style);
                console.log('[pet] appChanged: ' + packageName);
            },
            onFling: function(direction) {
                interact();
                addHeat(2);
                getPet().classList.remove('idle');
                getPet().classList.add(direction === 'left' ? 'fling-left' : 'fling-right');
                setTimeout(() => {
                    getPet().classList.remove('fling-left', 'fling-right');
                    getPet().classList.add('climb-back');
                    setFace('sad', 2000);
                    showBubble('甩我!自己爬回来…', 'whisper');
                    setTimeout(() => {
                        getPet().classList.remove('climb-back');
                        getPet().classList.add('idle');
                    }, 1400);
                }, 600);
                console.log('[pet] fling: ' + direction);
            },
            onRapidSwitching: function() {
                interact();
                setFace('excited', 3000);
                animate('proud', 600);
                showBubble('切太快了!耍杂技给你看~', 'jealous');
                console.log('[pet] rapidSwitching');
            },
            onBattery: function(charging, level) {
                if (charging) {
                    setFace('happy', 2500);
                    showBubble('在充电~满血复活!', 'pink');
                } else if (level < 15) {
                    setFace('sad', 2500);
                    showBubble('快没电了...记得充电哦', 'whisper');
                } else if (level < 30) {
                    showBubble('电量 ' + level + '%', 'whisper');
                }
                console.log('[pet] battery: charging=' + charging + ' level=' + level);
            },
            onWaterConfirm: function() {
                if (waterStage > 0) {
                    waterStage = 0;
                    setFace('happy', 2000);
                    showBubble('乖~喝完啦', 'pink');
                    console.log('[pet] water confirmed');
                }
            },
            setState: function(state) {
                if (state.heat !== undefined) { heat = Math.max(0, Math.min(100, state.heat)); updateHeat(); }
                if (state.mood && faces[state.mood]) setFace(state.mood, 3000);
                if (state.bubble) {
                    const level = analyzePush(state.bubble);
                    reactToLevel(level, state.bubble);
                } else if (state.text) {
                    const level = analyzePush(state.text);
                    reactToLevel(level, state.text);
                }
                console.log('[pet] setState: ' + JSON.stringify(state));
            },
            setHour: function(h) {
                console.log('[pet] hour set: ' + h);
            }
        };

        // 数组随机便捷方法
        Array.prototype.random = function() { return this[Math.floor(Math.random() * this.length)]; };

        /* ================= 启动序列 ================= */
        setTimeout(() => {
            const greetings = ['Hello!', "I'm here!", 'Pet me~', '你来啦~', '想你了~'];
            showBubble(greetings.random(), 'pink');
        }, 1000);

        setTimeout(() => {
            blink();
            idleMoodCycle();
            startHeatDecay();
            startWaterReminder();
            lonelyCheckTimer = setInterval(checkLoneliness, 30000);
            setInterval(ambientBubble, 25000 + Math.random() * 20000);
        }, 2500);

        console.log('[pet] engine ready');
    </script>
